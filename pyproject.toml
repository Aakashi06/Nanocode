[project]
name = "nanocode"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai", "requests"]

[project.scripts]
nanocode = "nanocode.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanocode*"]
